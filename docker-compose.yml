version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket_app
    command: bash -c "composer install && php artisan key:generate && php artisan migrate --seed && php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=ticket_management
      - DB_USERNAME=root
      - DB_PASSWORD=password
      - QUEUE_CONNECTION=database
    volumes:
      - .:/var/www
    depends_on:
      - db

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket_queue
    command: bash -c "sleep 15 && php artisan queue:work"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=ticket_management
      - DB_USERNAME=root
      - DB_PASSWORD=password
      - QUEUE_CONNECTION=database
    volumes:
      - .:/var/www
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: ticket_db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ticket_management
    ports:
      - "3308:3306"
    volumes:
      - ticket_db_data:/var/lib/mysql

volumes:
  ticket_db_data:
